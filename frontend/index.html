<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Progress Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Student Progress Tracker</h1>


  

    <form id="progressForm">

        
        <label for="studentName">
            Student Name
        </label>

        <input
            type="text"
            id="studentName"
            placeholder="Enter student name"
            required
        >

        <br><br>


      
        <label for="courseName">
            Course Name
        </label>

        <input
            type="text"
            id="courseName"
            placeholder="Enter course name"
            required
        >

        <br><br>


        <label for="completionPercentage">
            Completion Percentage
        </label>

        <input
            type="number"
            id="completionPercentage"
            placeholder="0 - 100"
            min="0"
            max="100"
            required
        >

        <br><br>


       
        <button
            type="submit"
            id="submitButton"
        >
            Add Progress
        </button>


        <button
            type="button"
            id="cancelEditButton"
            style="display: none;"
        >
            Cancel Edit
        </button>

    </form>



    <p id="statusMessage"></p>


    <hr>


  

    <h2>Saved Progress</h2>

    <div id="progressList"></div>


    <script src="script.js"></script>

</body>

</html>
